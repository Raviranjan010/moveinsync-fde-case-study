name: MoveInSync Play Store Ratings Monitor

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  monitor-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Execute Rating Refresh & Alert Monitor
        run: |
          python scripts/refresh_monitoring.py

      - name: Commit & Push Updated Datasets and Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitor): auto-refresh Google Play Store reviews & analytics [skip ci]"
          file_pattern: "data/ processed/* reports/*"
